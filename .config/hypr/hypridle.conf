general {
    lock_cmd = /home/rishabh/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    # Hold a sleep inhibitor until hyprlock has actually locked the session,
    # so suspend never happens before the lock is up (fixes the desktop
    # flashing on lid-close/resume). 3 = "lock notify".
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

listener {
    timeout = 200
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}
