# hyprlock — Catppuccin Mocha, blurred wallpaper, Inter clock.
# Fonts in use are installed: Inter (labels), Fira Code (mono).

general {
    hide_cursor = true
    ignore_empty_input = true      # a stray Enter won't flash a "wrong" state
}

background {
    monitor =
    path = /home/rishabh/Pictures/Wallpapers/wallpapers/staring-into-the-woods-3840×2160.jpg
    blur_passes = 1
    blur_size = 8
    brightness = 0.4
    contrast = 0.9
    vibrancy = 0.17
}

# ── Clock ─────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = rgba(205, 214, 244, 1.0)      # text
    font_size = 120
    font_family = Inter SemiBold
    position = 0, 300
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.6)
}

# ── Date ──────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +'%A, %d %B'
    color = rgba(166, 173, 200, 1.0)      # subtext0
    font_size = 22
    font_family = Inter Medium
    position = 0, 190
    halign = center
    valign = center
}

# ── Quote (Takehiko Inoue / Musashi) ──────────────────────────────────
# hyprlock labels are single-line, so each line is its own block, stacked
# from the bottom edge upward. Italic Noto Serif for a literary feel.
label {
    monitor =
    text = Preoccupied with a single leaf... you won't see the tree.
    color = rgba(186, 194, 222, 1.0)   # subtext1
    font_size = 19
    font_family = Noto Serif Italic
    position = 0, 250
    halign = center
    valign = bottom
}
label {
    monitor =
    text = Preoccupied with a single tree... you'll miss the entire forest.
    color = rgba(186, 194, 222, 1.0)
    font_size = 19
    font_family = Noto Serif Italic
    position = 0, 210
    halign = center
    valign = bottom
}
label {
    monitor =
    text = Don't be preoccupied with a single spot.
    color = rgba(186, 194, 222, 1.0)
    font_size = 19
    font_family = Noto Serif Italic
    position = 0, 170
    halign = center
    valign = bottom
}
label {
    monitor =
    text = See everything in its entirety... effortlessly.
    color = rgba(186, 194, 222, 1.0)
    font_size = 19
    font_family = Noto Serif Italic
    position = 0, 130
    halign = center
    valign = bottom
}
label {
    monitor =
    text = That is what it means to truly "see."
    color = rgba(205, 214, 244, 1.0)   # text (brighter — the punch line)
    font_size = 19
    font_family = Noto Serif Italic
    position = 0, 90
    halign = center
    valign = bottom
}
label {
    monitor =
    text = — Takehiko Inoue
    color = rgba(137, 180, 250, 1.0)   # blue
    font_size = 15
    font_family = Inter Medium
    position = 0, 45
    halign = center
    valign = bottom
}

# ── Input field ───────────────────────────────────────────────────────
input-field {
    monitor =
    size = 300, 55
    rounding = 27
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(137, 180, 250, 1.0)   # blue
    inner_color = rgba(30, 30, 46, 0.85)     # base, slightly translucent
    font_color  = rgba(205, 214, 244, 1.0)   # text

    check_color = rgba(249, 226, 175, 1.0)   # yellow  (verifying)
    fail_color  = rgba(243, 139, 168, 1.0)   # red     (wrong)
    capslock_color = rgba(250, 179, 135, 1.0) # peach

    placeholder_text = <i>Password or fingerprint</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fade_on_empty = false
    hide_input = false

    position = 0, -30
    halign = center
    valign = center
}

# ── Fingerprint (native fprintd, listens immediately — no keypress) ────
auth {
    fingerprint {
        enabled = true
        ready_message = 󰈷 Scan fingerprint
        present_message = Scanning...
        retry_delay = 250
    }
}
