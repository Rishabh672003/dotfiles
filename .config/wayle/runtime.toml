[bar]
scale = 0.7599999904632568
padding = 0.0
border-location = "bottom"
border-color = "border-subtle"
button-variant = "basic"
button-icon-size = 0.8999999761581421
button-gap = 0.6000000238418579
button-group-module-gap = 0.0
dropdown-autohide = true

[[bar.layout]]
monitor = "*"
show = true
left = [
    "dashboard",
    "hyprland-workspaces",
    "media",
]
center = ["clock"]
right = [
    "systray",
    "network",
    { name = "sound", modules = ["volume"] },
    { name = "sys", modules = [
    "cpu",
    "ram",
    "brightness",
    "battery",
] },
    { name = "group", modules = [
    "custom-wlsunset",
    "notifications",
] },
]

[styling.palette]
bg = "#15121b"
surface = "#181825"
elevated = "#1e1e2e"
fg = "#cdd6f4"
fg-muted = "#bac2de"
primary = "#b4befe"
red = "#f38ba8"
yellow = "#f9e2af"
green = "#a6e3a1"
blue = "#74c7ec"

[modules.battery]
icon-color = "#a6e3a1"
label-color = "#a6e3a1"

[[modules.battery.thresholds]]
below = 20.0
icon-color = "#11111b"
label-color = "#11111b"
button-bg-color = "#f38ba8"

[modules.brightness]
scroll-up = "brightnessctl set 1%+"
scroll-down = "brightnessctl set 1%-"

[modules.clock]
format = "%H:%M  -  %d/%m"
icon-color = "#f9e2af"
label-color = "#f9e2af"

[modules.cpu]
icon-color = "#f5c2e7"
label-color = "#f5c2e7"
label-max-length = 60
left-click = "/home/rishabh/.config/hypr/scripts/btop-toggle.sh"

[modules.dashboard]
dropdown-logout-command = 'hyprctl dispatch "hl.dsp.exit()"'

[modules.hyprland-workspaces]
min-workspace-count = 4
monitor-specific = false
show-special = false
display-mode = "icon"
divider = "  "
app-icons-show = true
icon-size = 1.100000023841858
label-size = 1.2000000476837158

[modules.media]
players-ignored = ["*playerctld*"]
format = "{{status_icon}} {{ artist }} - {{ title }}"
left-click = "wayle media play-pause"
right-click = "dropdown:media"
middle-click = "wayle media next"

[modules.microphone]
icon-color = "#f38ba8"
label-color = "#f38ba8"

[modules.network]
icon-color = "#fab387"
label-color = "#fab387"
right-click = "vicinae vicinae://launch/@theinfinityglitch/networks/networks"

[modules.notifications]
label-show = false

[modules.power]
left-click = "pkill wlogout || wlogout"

[modules.ram]
icon-color = "#7dc4e4"
label-color = "#7dc4e4"
label-max-length = 4
left-click = "/home/rishabh/.config/hypr/scripts/btop-toggle.sh"

[modules.systray]
icon-scale = 1.100000023841858
item-gap = 0.75
blacklist = []

[modules.volume]
icon-color = "#89b4fa"
label-color = "#89b4fa"
scroll-up = "pactl set-sink-volume @DEFAULT_SINK@ +1%"
scroll-down = "pactl set-sink-volume @DEFAULT_SINK@ -1%"

[modules.weather]
location = "Virar"

[[modules.custom]]
id = "wlsunset"
command = """pgrep -x wlsunset >/dev/null && echo '{"alt":"on"}' || echo '{"alt":"off"}'"""
mode = "poll"
interval-ms = 5000
restart-policy = "never"
restart-interval-ms = 1000
format = "{{ output }}"
tooltip-format = "Night light: {{ alt }}"
hide-if-empty = false
icon-name = "ld-sun-symbolic"
icon-show = true
icon-color = "auto"
icon-bg-color = "auto"
label-show = false
label-color = "auto"
label-max-length = 0
button-bg-color = "bg-surface-elevated"
border-show = false
border-color = "auto"
left-click = "pgrep -x wlsunset >/dev/null && pkill -x wlsunset || setsid -f wlsunset -l 19.465622 -L 72.806099 -t 3400 >/dev/null 2>&1"
right-click = ""
middle-click = ""
scroll-up = ""
scroll-down = ""
on-action = """sleep 0.3; pgrep -x wlsunset >/dev/null && echo '{"alt":"on"}' || echo '{"alt":"off"}'"""

[modules.custom.icon-map]
default = "ld-sun-symbolic"
off = "ld-sun-symbolic"
on = "ld-moon-symbolic"

[osd]
margin = 50.0
